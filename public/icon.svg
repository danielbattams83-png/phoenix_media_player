<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base App Tile Background with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>

  <!-- Glowing Radial Core -->
  <circle cx="256" cy="256" r="160" fill="#6366f1" opacity="0.18" filter="url(#glow)"/>

  <!-- Outer Stylized Vinyl / CD Track Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Rotating Diamond Accent Badge (Windows Media Player Logo Signature) -->
  <g transform="translate(256,256)">
    <rect x="-70" y="-70" width="140" height="140" rx="32" transform="rotate(45)" fill="url(#accentGrad)" filter="url(#glow)"/>
    
    <!-- Modern Play Triangle Centered -->
    <polygon points="-16,-34 38,0 -16,34" fill="#ffffff"/>
  </g>

  <!-- Equalizer Spectrum Bars Bottom Decor -->
  <g transform="translate(156, 400)">
    <rect x="0" y="-12" width="16" height="24" rx="8" fill="#6366f1"/>
    <rect x="26" y="-28" width="16" height="40" rx="8" fill="#818cf8"/>
    <rect x="52" y="-46" width="16" height="58" rx="8" fill="#8b5cf6"/>
    <rect x="78" y="-60" width="16" height="72" rx="8" fill="#ec4899"/>
    <rect x="104" y="-40" width="16" height="52" rx="8" fill="#a855f7"/>
    <rect x="130" y="-24" width="16" height="36" rx="8" fill="#6366f1"/>
    <rect x="156" y="-14" width="16" height="26" rx="8" fill="#818cf8"/>
    <rect x="182" y="-6" width="16" height="18" rx="8" fill="#4f46e5"/>
  </g>
</svg>
